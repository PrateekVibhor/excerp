appId: com.prateekvibhor.excerp
---
# Getting a question wrong does not verify the article: the score and a way to try again show, and the Profile's total does not change.
- runFlow: ../shared/clean-start.yaml
- runFlow: ../shared/dismiss-intro.yaml
- extendedWaitUntil:
    visible: "Open Model Weights Released for On-Device Use"
    timeout: 60000
- assertNotVisible: "Don't show this again"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Building a Retrieval Pipeline with Managed Vector Search"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Model Update: Improved Tool Calling and Structured Outputs"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Scaling Recommendation Inference on Commodity Hardware"
    timeout: 30000
- tapOn: "Scaling Recommendation Inference on Commodity Hardware"
- extendedWaitUntil:
    visible: "Take quiz"
    timeout: 30000
- tapOn: "Take quiz"
- extendedWaitUntil:
    visible: "Question 1 of 3"
    timeout: 30000
- tapOn: "Data labeling effort"
- extendedWaitUntil:
    visible: "Not quite. The right answer is marked in green."
    timeout: 15000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Question 2 of 3"
    timeout: 15000
- tapOn: "Frequently used embeddings"
- extendedWaitUntil:
    visible: "Correct"
    timeout: 15000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Question 3 of 3"
    timeout: 15000
- tapOn: "In stages, compared with the old path"
- extendedWaitUntil:
    visible: "Correct"
    timeout: 15000
- tapOn: "See result"
- extendedWaitUntil:
    visible: "2 of 3"
    timeout: 30000
- assertVisible: "Try again"
- assertNotVisible: "Verified"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Back"
    timeout: 30000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "VERIFIED"
    timeout: 30000
- assertVisible: "No verified articles yet"
- assertNotVisible: "1 verified articles"
