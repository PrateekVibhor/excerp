appId: com.prateekvibhor.excerp
---
# Passing a quiz verifies the article: the Verified result shows, and the Profile's Verified total goes up by one.
# The first three cards have no quiz, so they are skipped; the fourth is "Scaling Recommendation Inference on Commodity Hardware".
- runFlow: ../shared/clean-start.yaml
- runFlow: ../shared/dismiss-intro.yaml
- extendedWaitUntil:
    visible: "Open Model Weights Released for On-Device Use"
    timeout: 60000
- assertNotVisible: "Don't show this again"
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Building a Retrieval Pipeline with Managed Vector Search"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Model Update: Improved Tool Calling and Structured Outputs"
    timeout: 30000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Scaling Recommendation Inference on Commodity Hardware"
    timeout: 30000
- tapOn: "Scaling Recommendation Inference on Commodity Hardware"
- extendedWaitUntil:
    visible: "Take quiz"
    timeout: 30000
- tapOn: "Take quiz"
- extendedWaitUntil:
    visible: "Question 1 of 3"
    timeout: 30000
- tapOn: "Latency and cost"
- extendedWaitUntil:
    visible: "Correct"
    timeout: 15000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Question 2 of 3"
    timeout: 15000
- tapOn: "Frequently used embeddings"
- extendedWaitUntil:
    visible: "Correct"
    timeout: 15000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Question 3 of 3"
    timeout: 15000
- tapOn: "In stages, compared with the old path"
- extendedWaitUntil:
    visible: "Correct"
    timeout: 15000
- tapOn: "See result"
- extendedWaitUntil:
    visible: "You answered all 3 questions correctly. This article now carries a Verified badge."
    timeout: 30000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Back"
    timeout: 30000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
- tapOn: "Profile"
- scrollUntilVisible:
    element: "VERIFIED"
    timeout: 30000
- assertVisible: "1 verified articles"
- assertNotVisible: "No verified articles yet"
